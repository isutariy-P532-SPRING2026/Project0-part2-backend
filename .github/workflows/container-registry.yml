name: Docker Image CI for GHCR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B clean test package

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.ACCESS_TOKEN }}" | docker login ghcr.io -u ishitasutariya --password-stdin

      - name: Build the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker build -t ghcr.io/ishitasutariya/ducks-service:latest .

      - name: Push the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ghcr.io/ishitasutariya/ducks-service:latest